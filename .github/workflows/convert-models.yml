name: Convert Models to ONNX

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-node-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch onnx onnxscript librosa soundfile pydub ml-collections six

    - name: Run model conversion
      run: |
        python convert_models.py

    - name: Upload ONNX models artifact
      uses: actions/upload-artifact@v4
      with:
        name: converted-onnx-models
        path: converted_models/
