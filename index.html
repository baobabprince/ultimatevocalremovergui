<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Vocal Remover - Web Edition</title>
    <link rel="stylesheet" href="style.css">
    <script src="audio_utils.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>
    <div class="app-container">
        <header>
            <h1 id="app-title">Ultimate Vocal Remover - Web Edition</h1>
            <p id="app-subtitle">Client-side Vocal & Instrumental separation running entirely in your browser</p>
            <button id="lang-toggle-btn" class="lang-btn">עברית</button>
        </header>

        <main>
            <!-- File Select / Drop Zone -->
            <section class="file-container" id="drag-drop-zone">
                <div class="file-icon">🎵</div>
                <p id="file-select-label">Select Audio File</p>
                <p id="drag-drop-text" class="hint">or drag & drop file here</p>
                <p id="file-name-display" class="file-name"></p>
                <input type="file" id="audio-file-input" accept="audio/*" style="display: none;">
            </section>

            <!-- Model Selection -->
            <section class="controls-row">
                <div class="control-group">
                    <label id="model-label" for="model-select">Choose Model</label>
                    <select id="model-select"></select>
                </div>
                <div class="control-group">
                    <label id="format-label" for="format-select">Save Format</label>
                    <select id="format-select">
                        <option value="wav">WAV</option>
                    </select>
                </div>
            </section>

            <!-- Audio Tools -->
            <section class="tools-container">
                <div class="tools-panel">
                    <h3 id="audio-tools-label" style="margin: 0 0 12px 0; font-size: 16px; color: var(--accent);">Audio Tools</h3>
                    <div class="tools-grid">
                        <div class="control-group">
                            <label id="pitch-shift-label" for="pitch-shift-input">Pitch Shift (semitones)</label>
                            <input type="number" id="pitch-shift-input" value="0" step="1" min="-12" max="12">
                        </div>
                        <div class="control-group">
                            <label id="time-stretch-label" for="time-stretch-input">Time Stretch (factor)</label>
                            <input type="number" id="time-stretch-input" value="1.0" step="0.1" min="0.5" max="2.0">
                        </div>
                    </div>
                    <div class="tools-actions">
                        <p id="align-label" style="font-size: 13px; opacity: 0.8;">Align reference and target tracks</p>
                        <button id="align-btn" class="btn btn-primary" style="font-size: 14px; padding: 10px;" disabled>Run Alignment</button>
                        <button id="match-btn" class="btn btn-primary" style="font-size: 14px; padding: 10px;" disabled>Match Volume (RMS)</button>
                    </div>
                </div>
            </section>

            <!-- Action Buttons -->
            <section class="actions-row">
                <button id="convert-btn" class="btn btn-primary" disabled>Start Processing</button>
                <button id="stop-btn" class="btn btn-danger" disabled>Stop</button>
            </section>

            <!-- Progress Bars -->
            <section class="progress-container">
                <div class="progress-group">
                    <div class="progress-header">
                        <span id="download-label">Download progress</span>
                        <span id="download-percent">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div id="download-bar" class="progress-bar"></div>
                    </div>
                </div>
                <div class="progress-group">
                    <div class="progress-header">
                        <span id="processing-label">Separation progress</span>
                        <span id="processing-percent">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div id="processing-bar" class="progress-bar"></div>
                    </div>
                </div>
            </section>

            <!-- Playback + Download Outputs -->
            <section class="results-container" id="results-section" style="display:none;">
                <div class="result-card">
                    <h3 id="vocals-result-label">Vocals</h3>
                    <audio id="vocals-player" controls preload="metadata"></audio>
                    <button id="download-vocals-btn" class="btn" disabled>Download Vocals</button>
                </div>
                <div class="result-card">
                    <h3 id="inst-result-label">Instruments</h3>
                    <audio id="inst-player" controls preload="metadata"></audio>
                    <button id="download-inst-btn" class="btn" disabled>Download Instruments</button>
                </div>
            </section>

            <!-- Console Log -->
            <section class="console-container">
                <label id="log-label" for="console-log">Processing Log</label>
                <textarea id="console-log" readonly placeholder="Waiting for files..."></textarea>
            </section>
        </main>
    </div>
</body>
</html>
